<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Price Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header {
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.active {
            background: #764ba2;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .last-updated {
            text-align: right;
            color: #999;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .currency-toggle {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }

        .currency-toggle button {
            padding: 8px 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>₿ Bitcoin Price Tracker</h1>
            <p style="color: #666;">Real-time price updates and charts</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="currency-toggle">
            <button class="currency-btn active" data-currency="usd">USD</button>
            <button class="currency-btn" data-currency="eur">EUR</button>
            <button class="currency-btn" data-currency="gbp">GBP</button>
            <button class="currency-btn" data-currency="jpy">JPY</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Current Price</div>
                <div class="stat-value" id="current-price">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">24h Change</div>
                <div class="stat-value" id="change-24h">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">24h High</div>
                <div class="stat-value" id="high-24h">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">24h Low</div>
                <div class="stat-value" id="low-24h">--</div>
            </div>
        </div>

        <div class="controls">
            <button class="time-btn active" data-days="7">7 Days</button>
            <button class="time-btn" data-days="30">30 Days</button>
            <button class="time-btn" data-days="90">90 Days</button>
            <button class="time-btn" data-days="365">1 Year</button>
            <button id="refresh-btn">🔄 Refresh</button>
        </div>

        <div class="chart-container">
            <div id="loading" class="loading">Loading data...</div>
            <canvas id="priceChart" style="display: none;"></canvas>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
